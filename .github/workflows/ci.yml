name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check src/ --line-length=120
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/

  test-dataset:
    name: Test Dataset Utilities
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dataset dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/dataset/requirements.txt
    
    - name: Verify dataset structure
      run: |
        python -c "
        from pathlib import Path
        import sys
        
        # Check data directories exist
        data_dir = Path('data')
        required_dirs = ['train/invoice', 'train/label', 'test/invoice', 'test/label', 'validation/invoice', 'validation/label']
        
        for dir_path in required_dirs:
            full_path = data_dir / dir_path
            if not full_path.exists():
                print(f'❌ Missing directory: {full_path}')
                sys.exit(1)
            print(f'✅ Found directory: {full_path}')
        
        print('✅ Dataset structure verified')
        "
    
    - name: Test dataset utilities
      run: |
        cd src/dataset
        python -c "
        import json
        from pathlib import Path
        from PIL import Image
        
        # Test loading a sample invoice
        test_image = Path('../../data/test/invoice/invoice_0000.png')
        test_label = Path('../../data/test/label/invoice_0000.json')
        
        if test_image.exists() and test_label.exists():
            # Load image
            img = Image.open(test_image)
            print(f'✅ Loaded image: {img.size}')
            
            # Load label
            with open(test_label) as f:
                label = json.load(f)
            print(f'✅ Loaded label with {len(label[\"gt_parse\"][\"items\"])} items')
            
            print('✅ Dataset utilities working correctly')
        else:
            print('⚠️  Sample files not found, skipping test')
        "

  test-bedrock:
    name: Test Bedrock Code Structure
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install bedrock dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/bedrock/requirements.txt
    
    - name: Check Python syntax
      run: |
        python -m py_compile src/bedrock/*.py
        echo "✅ All Python files have valid syntax"
    
    - name: Verify config file
      run: |
        python -c "
        import json
        from pathlib import Path
        
        config_path = Path('src/bedrock/config.json')
        if config_path.exists():
            with open(config_path) as f:
                config = json.load(f)
            print(f'✅ Config file valid with {len(config)} models')
        else:
            print('⚠️  Config file not found')
        "

  documentation:
    name: Check Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check required files
      run: |
        files=("README.md" "LICENSE" "CONTRIBUTING.md" "docs/QUICKSTART.md")
        for file in "${files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ Found: $file"
          else
            echo "❌ Missing: $file"
            exit 1
          fi
        done
    
    - name: Check for broken links in README
      run: |
        # Basic check for common markdown issues
        if grep -q "]()" README.md; then
          echo "⚠️  Found empty links in README.md"
        else
          echo "✅ No empty links found"
        fi

